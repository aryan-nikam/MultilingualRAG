[project]
name = "multilingual-rag"
version = "0.1.0"
description = "Local-first multilingual RAG built component by component."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.141.1",
    "lingua-language-detector>=2.0",
    "psycopg[binary]>=3.2",
    "pymupdf>=1.24",
    "python-multipart>=0.0.20",
    "sentence-transformers>=3.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
mrag = "multilingual_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multilingual_rag"]
